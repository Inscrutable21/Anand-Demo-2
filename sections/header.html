<!-- AUTHENTIC CASA MOMO FLOATING LUXURY NAVBAR -->
<header class="site-header" id="siteHeader">
  <div class="header-container">
    
    <!-- Top-Left Wordmark: Fades in on scroll past hero, links to top -->
    <a href="#hero" class="brand-wordmark" id="brandWordmark" aria-label="Casa Momo Graz">
      <span class="brand-text">CASA MOMO</span>
    </a>

    <!-- Top-Right Floating Frosted Capsule Navigation & Audio Controls -->
    <div class="header-right-group">
      
      <!-- Frosted Capsule Navbar -->
      <nav class="nav-capsule" aria-label="Main Navigation">
        <a href="#apartments" class="nav-item">Apartments</a>
        <a href="#host" class="nav-item">About</a>
        <a href="#locations" class="nav-item">Contact</a>
        <button class="nav-cta-btn" id="navBookNowBtn" type="button">
          <span>Book Now</span>
          <span class="cta-arrow">&#8599;</span>
        </button>
      </nav>

      <!-- Circular Sound Toggle Button -->
      <button class="sound-toggle-btn" id="soundToggleBtn" aria-label="Toggle Ambient Audio" title="Sound Toggle" type="button">
        <!-- Audio ON SVG -->
        <svg class="sound-svg sound-svg-on" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <!-- Audio MUTED SVG -->
        <svg class="sound-svg sound-svg-off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>

      <!-- Mobile Hamburger Toggle -->
      <button class="mobile-toggle-btn" id="mobileToggleBtn" aria-label="Toggle Menu" type="button">
        <span class="toggle-line"></span>
        <span class="toggle-line"></span>
      </button>

    </div>

  </div>
</header>
